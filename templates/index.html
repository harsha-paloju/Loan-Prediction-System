<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left-panel">

        <div class="logo">
            <i class="fa-solid fa-building-columns"></i>
            <h2>LoanAI</h2>
        </div>

        <h1>Loan Approval Prediction</h1>

        <p>
            Predict whether a customer's loan application is likely to be approved
            using a Machine Learning model trained on historical banking data.
        </p>

        <div class="features">

            <div class="feature">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Secure Prediction</span>
            </div>

            <div class="feature">
                <i class="fa-solid fa-bolt"></i>
                <span>Instant Results</span>
            </div>

            <div class="feature">
                <i class="fa-solid fa-brain"></i>
                <span>Random Forest Model</span>
            </div>

            <div class="feature">
                <i class="fa-solid fa-chart-line"></i>
                <span>82% Prediction Accuracy</span>
            </div>

        </div>

    </div>



    <!-- Right Side -->

    <div class="right-panel">

        <div class="form-card">

            <h2>Customer Details</h2>

            <form action="/predict" method="POST">

                <div class="grid">

                    <div class="input-group">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Married</label>
                        <select name="married" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Dependents</label>
                        <select name="dependents" required>
                            <option value="">Select</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Education</label>
                        <select name="education" required>
                            <option value="">Select</option>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Self Employed</label>
                        <select name="self_employed" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Property Area</label>
                        <select name="property_area" required>
                            <option value="">Select</option>
                            <option value="Urban">Urban</option>
                            <option value="Semiurban">Semiurban</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Applicant Income</label>
                        <input
                            type="number"
                            name="applicant_income"
                            placeholder="Enter Income"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Coapplicant Income</label>
                        <input
                            type="number"
                            name="coapplicant_income"
                            placeholder="Enter Income"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Loan Amount</label>
                        <input
                            type="number"
                            name="loan_amount"
                            placeholder="Loan Amount"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Loan Term</label>
                        <input
                            type="number"
                            name="loan_amount_term"
                            placeholder="Example : 360"
                            required>
                    </div>

                    <div class="input-group full">
                        <label>Credit History</label>
                        <select name="credit_history" required>
                            <option value="">Select</option>
                            <option value="1">Good (1)</option>
                            <option value="0">Poor (0)</option>
                        </select>
                    </div>

                </div>

                <button class="predict-btn">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    Predict Loan Status

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
